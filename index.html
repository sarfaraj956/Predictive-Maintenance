<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2300f0ff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M12 2v4'/><path d='m4.93 4.93 2.83 2.83'/><path d='M2 12h4'/><path d='m4.93 19.07 2.83-2.83'/><path d='M12 22v-4'/><path d='m19.07 19.07-2.83-2.83'/><path d='M22 12h-4'/><path d='m19.07 4.93-2.83 2.83'/><circle cx='12' cy='12' r='4'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maintena AI — Next-Gen Predictive Maintenance & 3D Digital Twin</title>
    <meta name="description" content="Aero-industrial predictive maintenance intelligence platform with real-time 3D machine simulation and dual ML model diagnostics." />
    <!-- Pre-load & prevent theme flash -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('maintena_theme_preference');
          var isDark = true;
          if (saved === 'light') {
            isDark = false;
          } else if (saved === 'system') {
            isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-[#060913] dark:text-slate-100 antialiased font-sans min-h-screen selection:bg-cyan-500/30 selection:text-cyan-600 dark:selection:text-cyan-200 transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
